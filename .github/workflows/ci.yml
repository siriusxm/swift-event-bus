name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Validate DocC test links
        run: ruby scripts/update_docc_test_links.rb --check
      # Pin the Xcode and Swift 6.2 toolchain so compiler diagnostics and
      # SwiftSyntax dependency selection remain reproducible.
      - name: Select Xcode (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Build for iOS 16+
        run: xcodebuild -scheme EventBus -destination 'generic/platform=iOS' build
      - name: Build for tvOS 16+
        run: xcodebuild -scheme EventBus -destination 'generic/platform=tvOS' build
      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging
