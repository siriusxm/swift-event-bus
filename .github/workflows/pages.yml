name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website and documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Assemble website
        run: |
          mkdir -p pages-output
          cp -R Documentation/Website/. pages-output/
      - name: Build DocC documentation
        run: |
          swift package \
            --allow-writing-to-directory "$RUNNER_TEMP/eventbus-docc" \
            generate-documentation \
            --target EventBus \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path docs \
            --output-path "$RUNNER_TEMP/eventbus-docc"
          mkdir -p pages-output/docs
          cp -R "$RUNNER_TEMP/eventbus-docc/." pages-output/docs/
      - name: Validate Pages artifact
        run: |
          test -f pages-output/index.html
          test -f pages-output/docs/documentation/eventbus/index.html
          test -d pages-output/docs/js
          test -d pages-output/docs/css
          test -n "$(find pages-output/docs/js -type f -name '*.js' -print -quit)"
          test -n "$(find pages-output/docs/css -type f -name '*.css' -print -quit)"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
