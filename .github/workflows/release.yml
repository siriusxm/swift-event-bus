name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate without publishing
        required: true
        default: 1.0.0-beta.1
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate tag and release notes
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          test -f "Documentation/Releases/$RELEASE_VERSION.md"
      - name: Select Xcode (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Swift version
        run: swift --version
      - name: Build release configuration
        run: swift build -c release
      - name: Test
        run: swift test

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Documentation/Releases/$RELEASE_VERSION.md"
          release_args=(
            --verify-tag
            --title "$RELEASE_VERSION"
            --notes-file "$notes"
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" "${release_args[@]}"
